<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04060c" />
    <meta name="description" content="Geometry Rush V.2 — a one-button rhythm platformer. Five handcrafted tracks, three vehicles, everything locked to the beat." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Geometry Rush V.2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui { position: fixed; inset: 0; }
      #gate { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Geometry Rush gameplay"></canvas>
    <div id="ui"></div>
    <div id="gate"></div>
    <noscript>Geometry Rush V.2 needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
